# ── Prefix ──────────────────────────────────────────────────────────────────
# Use Ctrl-A as the prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ─────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true color
set -g mouse on               # click panes, resize, scroll
set -sg escape-time 0         # no delay after Esc (important for vim/nvim)
set -g history-limit 50000
set -g display-time 4000
set -g focus-events on        # pass focus events to apps (e.g. nvim auto-read)
setw -g aggressive-resize on  # resize to smallest *active* client, not all

# ── Windows & panes ─────────────────────────────────────────────────────────
set -g base-index 1           # number windows from 1 (easier keyboard reach)
setw -g pane-base-index 1
set -g renumber-windows on    # auto-renumber when a window is closed

# ── Intuitive splits (open in cwd) ──────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"   # Prefix | → vertical split
bind - split-window -v -c "#{pane_current_path}"   # Prefix - → horizontal split
bind c new-window -c "#{pane_current_path}"        # new window in cwd
unbind '"'
unbind %

# ── Vim-style pane navigation ────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Vim-style pane resize (repeatable) ───────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Copy mode (vi keys) ──────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode           # Prefix Enter → enter copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
# Copies reach the local clipboard via OSC 52 — also over SSH (Blink, Termius,
# iTerm2, Ghostty). On a Mac, also pipe to pbcopy.
set -s set-clipboard on
if-shell 'command -v pbcopy >/dev/null' 'set -s copy-command pbcopy'

# ── Reload config ────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Status bar ───────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 40
set -g status-right-length 60

# Colors: Catppuccin Macchiato, like nvim, bat, fzf, delta, lazygit and atuin.
set -g status-style 'bg=#24273a fg=#cad3f5'
set -g window-status-current-style 'bg=#8aadf4 fg=#24273a bold'
set -g pane-border-style 'fg=#494d64'
set -g pane-active-border-style 'fg=#8aadf4'
set -g message-style 'bg=#8aadf4 fg=#24273a bold'

set -g status-left '#[fg=#a6da95,bold] #S '
set -g status-right '#[fg=#f5a97f] %H:%M #[fg=#cad3f5]| #[fg=#91d7e3]#h '
