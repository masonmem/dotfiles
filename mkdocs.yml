# Documentation site. Preview: `pip install -r docs/requirements.txt && mkdocs serve`
# Published to GitHub Pages by .github/workflows/docs.yml on every push to main.
site_name: dotfiles
site_description: One repo for every machine — how it works, how to use it, how to change it.
site_url: https://masonmem.github.io/dotfiles/
repo_url: https://github.com/masonmem/dotfiles
repo_name: masonmem/dotfiles
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
exclude_docs: |
  requirements.txt

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
    logo: material/console
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # `--8<-- "path"` embeds a repo file, so reference pages show the real thing.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - New Mac (personal or work): getting-started/new-mac.md
      - QNAP / Linux server: getting-started/qnap.md
      - Dev containers: getting-started/dev-containers.md
      - Updating an existing machine: getting-started/existing-machines.md
  - Concepts:
      - concepts/index.md
      - How it works: concepts/how-it-works.md
      - Packages and profiles: concepts/packages.md
      - Shared, personal, host, machine: concepts/layers.md
      - What sync does: concepts/sync.md
      - Shell startup: concepts/shell.md
      - Shell framework pins: concepts/shell-framework.md
  - How-to:
      - how-to/index.md
      - Everyday workflow: how-to/daily-workflow.md
      - Add a tool: how-to/add-a-tool.md
      - Add or change a config file: how-to/add-or-change-config.md
      - Add shell aliases, functions, env: how-to/add-shell-config.md
      - Add a package: how-to/add-a-package.md
      - Add a machine or host-only setup: how-to/add-a-machine.md
      - Keep work and personal apart: how-to/work-machine.md
      - Remove things: how-to/remove-things.md
      - Update the shell framework: how-to/update-shell-framework.md
  - Reference:
      - reference/index.md
      - Repository layout: reference/layout.md
      - Commands: reference/commands.md
      - Shell (aliases, keys, env): reference/shell.md
      - Brewfiles and tool lists: reference/brewfiles.md
      - Untracked files and templates: reference/untracked-files.md
      - Local LLM stack (ollama): reference/llm-stack.md
  - Tool guides:
      - guides/index.md
      - Shell tools: guides/shell-tools.md
      - Neovim: guides/neovim.md
      - tmux: guides/tmux.md
      - lazygit: guides/lazygit.md
  - Troubleshooting: troubleshooting.md
  - Contributing and tests: contributing.md
