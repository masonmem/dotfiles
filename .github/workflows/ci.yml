# Every push runs the same checks as tests/run, because `sync-all` spreads a
# mistake to every machine.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh stow shellcheck
      - run: tests/run

  macos:
    # The real targets: BSD userland and Apple's /bin/bash 3.2, which is what
    # `#!/usr/bin/env bash` finds on the Macs (the Brewfile has no bash).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: brew install stow shellcheck
      - name: tests/run with Apple's bash 3.2 first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/applebash" && ln -s /bin/bash "$RUNNER_TEMP/applebash/bash"
          export PATH="$RUNNER_TEMP/applebash:$PATH"
          bash --version | head -1
          tests/run
