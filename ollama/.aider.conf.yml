# Aider config (stowed from ~/dotfiles/ollama).
#
# Routes through the LiteLLM gateway on solaris (https://llm.hyperionx.dev).
# The `aider` shell wrapper in 60-aider-wrapper.zsh exports
# OPENAI_API_KEY=$AIDER_LITELLM_KEY before exec — aider's YAML does NOT do
# ${} env interpolation, so the key MUST come in via env.
#
# Models use the `openai/...` form because LiteLLM speaks OpenAI on the
# wire (upstream model name is whatever litellm exposes — see
# homelab/solaris/litellm/config.yaml).
#
# ── Architect mode ──────────────────────────────────────────────────────
# aider's architect mode splits the work in two:
#   architect  → reasons about the change, proposes a patch
#   editor     → mechanically applies the diff (cheap/fast local coder)
# This pattern keeps the heavy-thinking turn on the strongest local
# reasoner while the repetitive diff-formatting turn runs on the local
# coder. Disable with `--no-architect` for a single-model session.
#
# LOCAL-ONLY (cloud removed 2026-06-11).
# Default architect: local/qwen3-14b-0x — strongest local reasoner.
# Default editor:    local/qwen2.5-coder-7b-0x — fast, diff-friendly.
# Weak model (commit msgs / repo summaries): local/qwen2.5-coder-7b-0x.

architect: true
model: openai/local/qwen3-14b-0x
editor-model: openai/local/qwen2.5-coder-7b-0x
weak-model: openai/local/qwen2.5-coder-7b-0x
edit-format: diff
auto-commits: false
openai-api-base: https://llm.hyperionx.dev/v1
