# lazygit configuration
# Docs: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  # Show nerd font icons (requires Nerd Font — already needed for p10k)
  nerdFontsVersion: "3"
  showIcons: true
  # Expand the focused side panel slightly for readability
  expandFocusedSidePanel: true
  # Scroll speed
  mouseEvents: true
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
authorColors:
  '*': "#b4befe"
git:
  pagers:
    - # Use delta for diffs inside lazygit — no paging (lazygit handles scrolling)
      colorArg: always
      pager: delta --color-only --dark --paging=never --line-numbers
  # Enables auto-fetching of remotes in background
  autoFetch: true
  autoRefresh: true
  # Show branch ahead/behind counts
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"
os:
  # Open files in neovim from within lazygit
  edit: "nvim {{filename}}"
  editAtLine: "nvim +{{line}} {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"
  open: "open {{link}}"
keybinding:
  universal:
    # Quit with q or Ctrl-C (both feel natural)
    quit: "q"
    quit-alt1: "<c-c>"
    return: "<esc>"
    togglePanel: "<tab>"
