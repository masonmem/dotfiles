# lazygit configuration
# Docs: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  # Nerd Font icons (the font p10k already needs)
  nerdFontsVersion: "3"
  # Expand the focused side panel slightly for readability
  expandFocusedSidePanel: true
  mouseEvents: true
  theme:
    activeBorderColor:
      - "#8aadf4"
      - bold
    inactiveBorderColor:
      - "#a5adcb"
    searchingActiveBorderColor:
      - "#eed49f"
    optionsTextColor:
      - "#8aadf4"
    selectedLineBgColor:
      - "#363a4f"
    inactiveViewSelectedLineBgColor:
      - "#6e738d"
    cherryPickedCommitBgColor:
      - "#494d64"
    cherryPickedCommitFgColor:
      - "#8aadf4"
    markedBaseCommitFgColor:
      - "#8aadf4"
    markedBaseCommitBgColor:
      - "#eed49f"
    unstagedChangesColor:
      - "#ed8796"
    defaultFgColor:
      - "#cad3f5"
authorColors:
  '*': "#b7bdf8"
git:
  # `diffRenderers` is the lazygit ≥ 0.65 name (formerly `pagers`). Keep the
  # current name: lazygit rewrites outdated keys in place, which would dirty
  # this repo through the symlink.
  diffRenderers:
    - # delta for diffs inside lazygit — no paging (lazygit handles scrolling)
      colorArg: always
      command: delta --color-only --dark --paging=never --line-numbers
  # Enables auto-fetching of remotes in background
  autoFetch: true
  autoRefresh: true
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium {{branchName}} --"
os:
  # `e` opens files in neovim. (open/openLink keep lazygit's per-OS defaults.)
  editPreset: "nvim"
keybinding:
  universal:
    # Quit with q or Ctrl-C (both feel natural)
    quit: "q"
    quit-alt1: "<c-c>"
    return: "<esc>"
    togglePanel: "<tab>"
