# atuin — only the settings that differ from the defaults. Every option, with
# its default: https://docs.atuin.sh/configuration/config/ (or `atuin default-config`).

style = "compact"
show_numeric_shortcuts = false
show_help = false
show_tabs = false
enter_accept = true        # Enter runs the command; Tab puts it on the prompt to edit

[sync]
records = true             # sync v2

[theme]
name = "catppuccin-macchiato-blue"   # themes/catppuccin-macchiato-blue.toml

[ui]
columns = [{ type = "duration", expand = false }, "time", { type = "command", expand = true }]
